name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Byte-compile (syntax check)
        run: python -m compileall -q agentgrid tests
      - name: Unit tests (SQLite, no third-party packages)
        run: python -m unittest discover -s tests -v

  postgres:
    name: Tests (Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: agentgrid
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agentgrid_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agentgrid -d agentgrid_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AGENTGRID_TEST_DATABASE_URL: postgresql://agentgrid:ci-only-password@localhost:5432/agentgrid_test?sslmode=disable
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install -r requirements.txt
      - name: Unit tests against Postgres
        run: python -m unittest discover -s tests -v

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade pip ruff
      - name: Ruff (syntax errors and undefined names)
        run: ruff check --select E9,F63,F7,F82 --output-format=github .
      - name: Validate JSON manifests
        run: python -c "import json; json.load(open('server.json'))"
