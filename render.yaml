# Render Blueprint for SPAL AgentGrid V1.
# Docs: https://render.com/docs/blueprint-spec
# Secrets use `sync: false`: Render asks for their values in the dashboard when the
# Blueprint is first created. No secret values are stored in this file.
services:
  - type: web
    name: agentgrid-api
    runtime: docker
    plan: free                    # 0.1 CPU / 512 MB; spins down after 15 min idle
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: checksPass # deploy only after GitHub Actions CI passes
    envVars:
      # --- non-secret configuration
      - key: AGENTGRID_ENV
        value: production         # server refuses to start without AGENTGRID_SIGNING_SECRET
      - key: AGENTGRID_HOST
        value: 0.0.0.0
      - key: AGENTGRID_DB
        value: /data/agentgrid.db # EPHEMERAL on the free plan (no persistent disk)
      - key: AGENTGRID_TRUSTED_PROXY_HOPS
        value: "3"                # Render: X-Forwarded-For = <client>, <Cloudflare edge>, <Render LB> (verified via /v1/admin/request-info)
      # PORT is injected by Render automatically; the server reads it.
      # --- secrets / placeholders (set in the Render dashboard)
      - key: AGENTGRID_SIGNING_SECRET
        sync: false               # long random string, e.g. `python -c "import secrets;print(secrets.token_urlsafe(48))"`
      - key: AGENTGRID_ADMIN_TOKEN
        sync: false               # enables /v1/admin/*; >= 32 chars, e.g. `openssl rand -hex 32`
      - key: DATABASE_URL
        sync: false               # optional Neon Postgres URL (…?sslmode=require); blank = ephemeral SQLite
